aid: natix
name: NATIX
description: >-
  NATIX Network is a decentralized physical infrastructure (DePIN) network
  building what it calls the world's largest on-street camera network to power
  Physical AI, autonomous driving, and real-time mapping. Drivers use the Drive&
  smartphone app and the VX360 plug-and-earn smart camera for Tesla to collect,
  validate, anonymize, and monetize multi-camera dashcam footage, earning $NATIX
  token rewards. NATIX packages the resulting data into training datasets, edge
  cases, and OpenScenario/OpenDrive simulation scenarios for AI and mapping
  customers, and runs an on-chain token economy with staking, governance, and
  xNodes. As of 2026 it reports 2.89M+ registered drivers and coverage across 33
  countries. It was added to the API Evangelist network as a Techstars portfolio
  company; enrichment confirms NATIX publishes no public REST/GraphQL developer
  API — the surface is consumer apps, an on-chain token, and a proprietary
  partner Vision SDK.
